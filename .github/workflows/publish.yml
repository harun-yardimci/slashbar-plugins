name: Publish index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/**"
      - "CATALOG.md"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: python3 scripts/validate.py

      - name: Build generated files
        run: python3 scripts/build_index.py

      # The app fetches index.json over raw.githubusercontent.com and GitHub
      # renders CATALOG.md. Committing both is all the publishing we need.
      - name: Commit index.json and CATALOG.md
        run: |
          cp public/index.json index.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json CATALOG.md
          git diff --cached --quiet || git commit -m "Rebuild index.json and CATALOG.md [skip ci]"
          git push
