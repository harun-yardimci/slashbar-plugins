name: Publish index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: python3 scripts/validate.py

      - name: Build index.json
        run: python3 scripts/build_index.py

      # The app fetches the index over raw.githubusercontent.com, so committing
      # it to main is all the "publishing" we need. Skips cleanly when nothing
      # changed. (Move to GitHub Pages later if a browsable catalog is wanted.)
      - name: Commit index.json
        run: |
          cp public/index.json index.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "Rebuild index.json"
          git push
